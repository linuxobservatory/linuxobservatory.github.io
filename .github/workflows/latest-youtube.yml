name: Refresh latest YouTube uploads
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: latest-youtube-videos
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh YouTube data
        run: python3 scripts/update_latest_videos.py
      - name: Commit new uploads
        run: |
          if git diff --quiet -- data/latest-videos.json && [ -f data/latest-videos.json ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-videos.json
          git diff --cached --quiet || (git commit -m "Update latest YouTube videos" && git push)

name: Refresh public video catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: "36 3 * * *"
permissions:
  contents: write
concurrency:
  group: latest-youtube-videos
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install yt-dlp==2026.10.26
      - name: Read and validate the complete uploads playlist
        shell: bash
        run: |
          set -o pipefail
          yt-dlp --abort-on-error --flat-playlist --dump-single-json 'https://www.youtube.com/playlist?list=UUNq7pDavJRTEjg3AOdcuMAg' | python scripts/build_video_catalog.py
      - name: Save changed catalogue
        run: |
          if git diff --quiet -- data/video-catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/video-catalog.json
          git commit -m 'Refresh verified public video catalogue'
          git push
